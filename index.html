<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema Antifraude</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="institutional-panel">
        <img src="img/Tecnologico_TESA-removebg-preview.png" alt="Tecnológico San Antonio Tesa" class="tecnologico-logo">
        <div class="logo-header">
            <img src="img/Sistema_antifraude_con_logo_CA-removebg-preview.png" alt="Sistema Antifraude" class="logo-principal">
            <div class="logo-line"></div>
        </div>
    </div>
    
    <div class="login-card">
        <h2>Acceso al Sistema</h2>
        <input type="text" id="usuario" placeholder="Usuario o correo" autocomplete="username" required>
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=10"></script>
<script src="script.js?v=10"></script>
</body>
</html>
