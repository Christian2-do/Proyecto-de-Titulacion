<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema Antifraude</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-container">
    <div class="logo-header">
        <img src="img/Sistema_antifraude_con_logo_CA-removebg-preview.png" alt="Sistema Antifraude" class="logo-principal">
        <div class="logo-line"></div>
    </div>
    
    <div class="login-card">
        <h2>Acceso al Sistema</h2>
        <input type="text" id="usuario" placeholder="Usuario" autocomplete="off">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
