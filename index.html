<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema Antifraude</title>
<link rel="stylesheet" href="styles.css?v=20">
</head>
<body class="login-page">

<div class="login-container">
    <div class="institutional-panel">
        <img src="img/Tecnologico_TESA-removebg-preview.png" alt="Tecnológico San Antonio Tesa" class="tecnologico-logo">
        <div class="logo-header">
            <img src="img/Sistema_antifraude_con_logo_CA-removebg-preview.png" alt="Sistema Antifraude" class="logo-principal">
            <div class="logo-line"></div>
        </div>
    </div>
    
    <div class="login-card">
        <h2>Acceso al Sistema</h2>
        <label for="usuario">Nombre de usuario</label>
        <input type="email" id="usuario" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" onclick="login()">Iniciar sesión</button>
        <button type="button" class="forgot-password" onclick="restablecerContrasena()">Olvidé mi contraseña</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=12"></script>
<script src="script.js?v=19"></script>
</body>
</html>
